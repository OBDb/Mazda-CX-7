generations:
  - name: "First Generation Pre-Facelift (ER)"
    start_year: 2007
    end_year: 2009
    description: "The Mazda CX-7 was introduced as a mid-size crossover SUV with sport sedan-inspired styling, positioned below the larger CX-9 in Mazda's lineup. The exterior featured a distinctive design with a steeply raked windshield, prominent fenders, and a sloping roofline. Powered exclusively by a 2.3L turbocharged inline-four MZR L3-VDT DISI engine producing 244 hp at 5000 rpm and 258 lb-ft of torque at 2500 rpm, paired with a six-speed Aisin F21 automatic transmission. Available in front-wheel drive or all-wheel drive with Active Torque Split system that can send up to 50% torque to rear wheels. The interior featured a driver-focused cockpit with three-dial instrument cluster, three-spoke steering wheel shared with MX-5, and available leather seating, Bose audio, and navigation. Based on the Ford C1 platform shared with Ford Focus and Mazda3. Production began February 2006, sold as 2007 model year."
  - name: "First Generation Facelift (ER)"
    start_year: 2010
    end_year: 2012
    description: "The Mazda CX-7 received a significant mid-cycle refresh for the 2010 model year. Exterior updates included revised front and rear fascias with a larger five-point grille design similar to contemporary RX-8, MX-5 and Mazda3. Interior revisions featured blackout meters with 3D dials, 4.1-inch TFT color Multi Information Display, Bluetooth compatibility, and Blind Spot Monitoring System. New engine options added: a 2.5L MZR L5-VE naturally aspirated inline-four producing 161 hp for improved fuel economy, and a 2.2L MZR-CD turbo diesel available in Europe with manual transmission. The facelift was unveiled at the February 2009 Canadian International AutoShow. Production ended August 2012, replaced by the smaller but more space-efficient CX-5."
